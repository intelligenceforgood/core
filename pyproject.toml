[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = [
  "faiss-cpu",
  "fastapi",
  "uvicorn[standard]",
  "google-api-python-client",
  "google-auth-httplib2",
  "google-cloud-discoveryengine>=0.15.0,<1.0",
  "google-genai>=1.0.0,<2.0",
  "google-cloud-storage",
  "google-cloud-secret-manager",
  "jinja2",
  "langchain",
  "langchain-chroma",
  "langchain-community",
  "langchain-ollama",
  "httpx",
  "paddleocr[all]",
  "Pillow",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.1,<3",
  "phonenumbers>=8.13,<9",
  "python-multipart",
  "pg8000",
  "cloud-sql-python-connector[pg8000]",
  "protobuf>=5,<6",
  "pytesseract",
  "pypdfium2",
  "python-docx",
  "openpyxl",
  "pyyaml",
  "reportlab",
  "requests",
  "rich",
  "sqlalchemy>=2.0,<3",
  "tqdm",
  "typer[all]>=0.12.3",
  "alembic>=1.13,<2",
]
description = "Scratchpad for prototype utilities."
dynamic = ["version"]
license = {file = "LICENSE"}
name = "i4g"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-mock",
  "pytest-anyio",
  "pip-tools",
  "pre-commit",
]

[project.scripts]
i4g = "i4g.cli.app:app"

[tool.hatch.version]
path = "VERSION.txt"
pattern = "(?P<version>.+)"

[tool.pytest.ini_options]
markers = [
  "integration: marks tests as integration tests (slower)",
]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "B008", # FastAPI Depends() in argument defaults is idiomatic — not a bug
]
select = ["E", "F", "N", "W", "UP", "B", "SIM"] # "I" omitted: isort handles import ordering

[tool.ruff.lint.per-file-ignores]
"scripts/infra/*" = ["E501"]
"scripts/migration/*" = ["E501"]
"tests/**" = ["N806", "N803"] # PascalCase Mock class assignments are intentional
"tests/adhoc/*" = ["E501"]
