name: Entity Extraction QA

on:
  pull_request:
    paths:
      - "src/i4g/extraction/**"
      - "config/entity_blocklist.toml"
      - "config/settings.default.toml"
      - "tests/unit/extraction/**"

jobs:
  quality-gate:
    name: Extraction Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run rule-only extraction QA
        env:
          I4G_PROJECT_ROOT: ${{ github.workspace }}
          I4G_ENV: local
          I4G_LLM__PROVIDER: mock
          # Run with regex+heuristic only — no LLM latency in CI.
          EXTRACTION_ENABLED_MODULES: '["regex", "heuristic"]'
        run: |
          i4g entity-qa score \
            --bundle regression-v1 \
            --threshold 0.8 \
            --format text

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-qa-report
          path: data/entity-qa/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Annotate rule-gated types
        if: always()
        run: |
          echo "::notice::Entity QA ran with rule-only modules (regex + heuristic). LLM-dependent entity types (person, organization, scam_indicator) are not fully tested in CI. Run 'i4g entity-qa score --bundle regression-v1' locally with LLM enabled for full coverage."
