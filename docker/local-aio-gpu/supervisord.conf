[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:ollama]
command=ollama serve
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
# Let Ollama use up to 48 GB system RAM for KV cache / partial offload.
# The 4090's 24 GB VRAM handles model weights; system RAM handles overflow.
environment=OLLAMA_MAX_LOADED_MODELS="2",OLLAMA_NUM_PARALLEL="4"

[program:core-api]
command=uvicorn i4g.api.app:app --host 0.0.0.0 --port 8000
directory=/app/core
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ssi-api]
command=uvicorn ssi.api.app:app --host 0.0.0.0 --port 8100
directory=/app/ssi
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ui-console]
command=npx next start -p 3000
directory=/app/ui/apps/web
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
